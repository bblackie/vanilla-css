<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Wireframe Demo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="{{ url_for('index') }}">LOGO</a>
      <nav class="site-nav">
        <a href="{{ url_for('index') }}">Listing</a>
        <a href="{{ url_for('gallery') }}">Gallery</a>
        <a href="{{ url_for('summary') }}">Summary</a>
        <a href="#">Nav Item</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Footer &mdash; lorem ipsum dolor sit amet</p>
    </div>
  </footer>

</body>
</html>
